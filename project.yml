name: Prismatic
options:
  bundleIdPrefix: dev.prismatic
  deploymentTarget: { iOS: "14.0" }   # Geode iOS needs 14; nothing here requires newer
packages:
  ApplePackage:
    path: Packages/ApplePackage
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation
    from: 0.9.19
targetTemplates:
  App:
    type: application
    platform: iOS
    sources: [Prismatic]
    dependencies:
      - package: ZIPFoundation
      - package: ApplePackage
      - framework: OpenSSL/Frameworks/OpenSSL.xcframework   # fetched by CI / see README
        embed: true
    settings:
      base:
        CLANG_CXX_LANGUAGE_STANDARD: gnu++17
        HEADER_SEARCH_PATHS: "$(SRCROOT)/Prismatic/Vendor/ZSign $(SRCROOT)/Prismatic/Vendor/ZSign/common $(SRCROOT)/Prismatic/Vendor/litehook/src $(SRCROOT)/Prismatic/Vendor/litehook/external/include $(SRCROOT)/Prismatic/Vendor/DyldBypass"
        FRAMEWORK_SEARCH_PATHS: "$(SRCROOT)/OpenSSL/Frameworks/iphoneos"
        OTHER_LDFLAGS: "$(inherited) -lc++"
        SWIFT_OBJC_BRIDGING_HEADER: Prismatic/Launcher/Prismatic-Bridging-Header.h
        PRODUCT_BUNDLE_IDENTIFIER: dev.prismatic.launcher
        INFOPLIST_FILE: Prismatic/Info.plist
        IPHONEOS_DEPLOYMENT_TARGET: "14.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
targets:
  Prismatic:                # sideload build (SideStore/AltStore/Feather): needs JIT + decrypted IPA
    templates: [App]
    settings:
      base:
        PRODUCT_NAME: Prismatic
        CODE_SIGN_ENTITLEMENTS: Prismatic/Prismatic.entitlements
  Prismatic-TrollStore:     # .tipa: decrypts the installed App Store GD (TrollDecrypt method)
    templates: [App]
    settings:
      base:
        PRODUCT_NAME: Prismatic-TrollStore
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) PRISMATIC_TROLLSTORE"
        GCC_PREPROCESSOR_DEFINITIONS: "$(inherited) PRISMATIC_PRIVILEGED=1"
  Prismatic-Jailbreak:      # .deb: installs the exact pulled version, decrypts on launch
    templates: [App]
    settings:
      base:
        PRODUCT_NAME: Prismatic-Jailbreak
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) PRISMATIC_JAILBREAK"
        GCC_PREPROCESSOR_DEFINITIONS: "$(inherited) PRISMATIC_PRIVILEGED=1 PRISMATIC_JAILBREAK=1"
