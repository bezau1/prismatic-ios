name: Build

on:
  workflow_dispatch:          # run it yourself: Actions -> Build -> Run workflow
    inputs:
      build:
        description: Which build (each one uses a macOS runner)
        type: choice
        default: all
        options: [all, standard, trollstore, jailbreak]
  push:
    branches: [main]

jobs:
  plan:                        # cheap Linux job: decides which macOS builds to queue
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - id: m
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          want = "${{ inputs.build }}" or "all"
          all_ = [{"scheme":"Prismatic","kind":"standard"},
                  {"scheme":"Prismatic-TrollStore","kind":"trollstore"},
                  {"scheme":"Prismatic-Jailbreak","kind":"jailbreak"}]
          pick = [b for b in all_ if want in ("all", b["kind"])]
          print("matrix=" + json.dumps({"include": pick}))
          PY

  build:
    needs: plan
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: brew install xcodegen ldid dpkg
      - name: Fetch OpenSSL xcframework (needed by ZSign)
        run: |
          git clone --depth 1 --branch 3.6.5000 --filter=blob:none --sparse https://github.com/krzyzanowskim/OpenSSL OpenSSL
          git -C OpenSSL sparse-checkout set Frameworks
      - run: xcodegen generate
      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild -project Prismatic.xcodeproj -scheme "${{ matrix.scheme }}" -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build | tee build.log | tail -n 60
      - name: Package
        run: |
          APP="build/Build/Products/Release-iphoneos/${{ matrix.scheme }}.app"
          mkdir -p out
          case "${{ matrix.kind }}" in
            standard)
              mkdir Payload && cp -R "$APP" Payload/ && zip -qry out/Prismatic.ipa Payload ;;
            trollstore)
              ldid -SPrismatic/Privileged.entitlements "$APP/${{ matrix.scheme }}"
              mkdir Payload && cp -R "$APP" Payload/ && zip -qry out/Prismatic-TrollStore.tipa Payload ;;
            jailbreak)
              ldid -SPrismatic/Privileged.entitlements "$APP/${{ matrix.scheme }}"
              for mode in rootful rootless; do
                if [ $mode = rootful ]; then DIR=Applications; ARCH=iphoneos-arm; else DIR=var/jb/Applications; ARCH=iphoneos-arm64; fi
                rm -rf pkg && mkdir -p pkg/$DIR pkg/DEBIAN
                cp -R "$APP" pkg/$DIR/Prismatic.app
                printf 'Package: dev.prismatic.launcher\nName: Prismatic\nVersion: 0.1.0\nArchitecture: %s\nSection: Utilities\nDepends: firmware (>= 14.0)\nDescription: Geometry Dash instance launcher\nMaintainer: Prismatic\nAuthor: Prismatic\n' $ARCH > pkg/DEBIAN/control
                printf '#!/bin/sh\nuicache -p /%s/Prismatic.app 2>/dev/null || true\n' $DIR > pkg/DEBIAN/postinst; chmod 755 pkg/DEBIAN/postinst
                dpkg-deb -Zxz -b pkg out/Prismatic-Jailbreak-$mode.deb
              done ;;
          esac
      - uses: actions/upload-artifact@v4
        with: { name: "${{ matrix.scheme }}", path: out/* }
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: "build-log-${{ matrix.kind }}", path: build.log }
